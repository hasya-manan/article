<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Login - The Article Journal</title>
    
    <!-- Load Tailwind, Axios, and API config -->
    <script src="/js/head.js"></script>

    <style>
        /* Match the vintage newspaper fonts */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600&display=swap');
        
        body { 
            background-color: #f4f1ea; 
            font-family: 'Inter', sans-serif; 
            color: #1a1a1a;
        }
        .font-newspaper { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Main Card Container -->
    <div class="bg-white rounded-sm shadow-2xl overflow-hidden flex max-w-4xl w-full min-h-150 border border-gray-300">
        
        <!-- Left Side: Form -->
        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
            
            <div class="mb-8 border-b-2 border-black pb-4">
                <h2 class="font-newspaper text-4xl font-bold text-gray-900 mb-2">Author Login</h2>
                <p class="text-gray-600 text-sm uppercase tracking-widest font-semibold">The Article Journal</p>
            </div>

            <form id="loginForm" onsubmit="login(event)">
                <!-- Email Input -->
                <div class="mb-6">
                    <label class="block text-xs font-bold uppercase tracking-widest text-gray-600 mb-2">Email Address</label>
                    <input type="email" id="email"  placeholder="john.doe@gmail.com" 
                        class="w-full px-4 py-3 bg-transparent border-b-2 border-gray-300 focus:outline-none focus:border-black transition text-gray-800">
                </div>

                <!-- Password Input -->
                <div class="mb-6 relative">
                    <label class="block text-xs font-bold uppercase tracking-widest text-gray-600 mb-2">Password</label>
                    <input type="password" id="password"  placeholder="••••••••" 
                        class="w-full px-4 py-3 bg-transparent border-b-2 border-gray-300 focus:outline-none focus:border-black transition text-gray-800 pr-16">
                    <button type="button" onclick="togglePassword()" class="absolute right-0 bottom-3 text-xs font-bold text-gray-500 hover:text-black uppercase tracking-widest transition">Show</button>
                </div>

                <!-- Error Message Container -->
                <div id="errorMessage" class="hidden mb-6 text-sm text-red-700 bg-red-50 p-3 border border-red-200"></div>

                <!-- Login Button -->
                <button type="submit" class="w-full bg-black hover:bg-gray-800 text-white font-bold uppercase tracking-widest text-sm py-4 transition mb-6 flex justify-center items-center gap-2">
                    Log In <span>&rarr;</span>
                </button>

                <!-- Divider -->
                <div class="flex items-center mb-6">
                    <div class="grow border-t border-gray-300"></div>
                    <span class="px-4 text-xs text-gray-500 font-bold uppercase tracking-widest">or</span>
                    <div class="grow border-t border-gray-300"></div>
                </div>

                <!-- Google Button (Mockup) -->
                <button type="button" class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-bold uppercase tracking-widest text-xs py-4 transition mb-6 flex justify-center items-center gap-3">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                    Continue with Google
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="/" class="text-xs font-bold text-gray-500 hover:text-black uppercase tracking-widest transition">&larr; Back to Newspaper</a>
            </div>

        </div>

        <!-- Right Side: Image Placeholder -->
        <div class="hidden md:block w-1/2 bg-gray-100 relative border-l border-gray-300 p-6">
            <div class="absolute inset-6 bg-[#f4f1ea] border border-gray-300 flex flex-col items-center justify-center text-center p-8">
                <h1 class="font-newspaper text-5xl font-black uppercase tracking-widest mb-4">The<br>Article<br>Journal</h1>
                <p class="text-xs font-bold uppercase tracking-widest text-gray-500">Editorial Board Access Only</p>
            </div>
        </div>

    </div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }

        async function login(e) {
            if(e) e.preventDefault();
            const btn = document.querySelector('button[type="submit"]');
            const errorBox = document.getElementById('errorMessage');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = 'Authenticating...';
            btn.disabled = true;
            errorBox.classList.add('hidden');

            try {
                await api.get('/sanctum/csrf-cookie');
                
                await api.post('/api/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                
                btn.innerHTML = 'Success! Redirecting...';
                btn.classList.replace('bg-black', 'bg-green-700');
                
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 500); 

            } catch (err) {
                errorBox.innerText = err.response?.data?.message || 'Invalid credentials. Please try again.';
                errorBox.classList.remove('hidden');
                
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
