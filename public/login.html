<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Article API</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/api.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-[#faf5ff] flex items-center justify-center min-h-screen p-4">

    <!-- Main Card Container -->
    <div class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] overflow-hidden flex max-w-5xl w-full min-h-[650px] border border-purple-50">
        
        <!-- Left Side: Form -->
        <div class="w-full md:w-1/2 p-8 md:p-14 flex flex-col justify-center">
            
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome back!</h2>
                <p class="text-gray-500 text-sm">Pick up where you left off, and keep things moving.</p>
            </div>

            <form id="loginForm" onsubmit="login(event)">
                <!-- Email Input -->
                <div class="mb-5">
                    <input type="email" id="email" value="test@example.com" placeholder="john.doe@gmail.com" 
                        class="w-full px-5 py-3.5 bg-purple-50/50 border border-purple-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#d8b4e2] focus:bg-white transition text-gray-700 placeholder-gray-400">
                </div>

                <!-- Password Input -->
                <div class="mb-5 relative">
                    <input type="password" id="password" value="password" placeholder="••••••••" 
                        class="w-full px-5 py-3.5 bg-purple-50/50 border border-purple-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#d8b4e2] focus:bg-white transition text-gray-700 placeholder-gray-400 pr-16">
                    <button type="button" onclick="togglePassword()" class="absolute right-5 top-4 text-sm font-medium text-purple-400 hover:text-purple-600 transition">Show</button>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between mb-8">
                    <label class="flex items-center text-sm text-gray-600 cursor-pointer">
                        <input type="checkbox" class="w-4 h-4 mr-2 rounded border-purple-200 text-[#c084fc] focus:ring-[#c084fc] bg-purple-50">
                        Remember me
                    </label>
                    <a href="#" class="text-sm font-medium text-purple-500 hover:text-purple-700 transition">Forgot password?</a>
                </div>

                <!-- Error Message Container -->
                <div id="errorMessage" class="hidden mb-4 text-sm text-red-500 bg-red-50 p-3 rounded-lg border border-red-100"></div>

                <!-- Login Button -->
                <button type="submit" class="w-full bg-[#c084fc] hover:bg-[#a855f7] text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-purple-200 mb-6 flex justify-center items-center gap-2">
                    Log In <span>&rarr;</span>
                </button>

                <!-- Divider -->
                <div class="flex items-center mb-6">
                    <div class="grow border-t border-gray-100"></div>
                    <span class="px-4 text-xs text-gray-400 font-medium">or</span>
                    <div class="grow border-t border-gray-100"></div>
                </div>

                <!-- Google Button (Mockup) -->
                <button type="button" class="w-full bg-white border border-gray-200 hover:bg-gray-50 text-gray-600 font-medium py-3.5 rounded-xl transition mb-8 flex justify-center items-center gap-3">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
                    Continue with Google
                </button>

                <!-- Sign Up Link -->
                <p class="text-center text-sm text-gray-500">
                    Don't have an Account? <a href="#" class="text-purple-500 hover:text-purple-700 font-semibold transition">Sign up</a>
                </p>
            </form>

        </div>

        <!-- Right Side: Image Placeholder -->
        <div class="hidden md:block w-1/2 bg-purple-50 relative p-4">
            <div class="absolute inset-4 bg-gradient-to-br from-[#fbcfe8] via-[#e9d5ff] to-[#bfdbfe] rounded-2xl flex items-center justify-center">
                <p class="text-white font-medium text-lg bg-white/30 px-6 py-3 rounded-full backdrop-blur-md shadow-sm">Your Image Here</p>
            </div>
        </div>

    </div>

    <script>
        
        

        function togglePassword() {
            const pwd = document.getElementById('password');
            pwd.type = pwd.type === 'password' ? 'text' : 'password';
        }

        async function login(e) {
            if(e) e.preventDefault();
            const btn = document.querySelector('button[type="submit"]');
            const errorBox = document.getElementById('errorMessage');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = 'Logging in...';
            btn.disabled = true;
            errorBox.classList.add('hidden');

            try {
                await axios.get('/sanctum/csrf-cookie');
                
                await axios.post('/api/login', {
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value
                });
                
                // Login successful, go to dashboard
                btn.innerHTML = 'Success! Redirecting...';
                btn.classList.replace('bg-[#c084fc]', 'bg-emerald-400');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 500); // half second delay so they see the green success state

            } catch (err) {
                // Show error message beautifully
                errorBox.innerText = err.response?.data?.message || 'Something went wrong. Please try again.';
                errorBox.classList.remove('hidden');
                
                // Reset button
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
