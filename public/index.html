<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily - Articles</title>
  
   
    <script src="/js/head.js"></script>
   
  

    <!-- 3. Page-specific fonts -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@400;500;600&display=swap');
        
        /* Override the default font just for this page */
        body { 
            background-color: #f4f1ea;
            font-family: 'Inter', sans-serif; 
            color: #1a1a1a;
        }
        .font-newspaper { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="min-h-screen flex justify-center p-4 md:p-8">

    
    <!-- Newspaper Container -->
    <div class="bg-white max-w-6xl w-full shadow-2xl border border-gray-200 p-6 md:p-12">

        
        <!-- Header -->
                <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="font-newspaper text-5xl md:text-7xl font-black uppercase tracking-widest border-b-4 border-black pb-4 mb-2">
                The Article Journal
            </h1>
            
            <!-- UPDATE THIS SECTION -->
            <div class="flex justify-between items-center text-xs md:text-sm uppercase tracking-widest font-semibold border-b border-black pb-2">
                
                <!-- Left Side: Location and Date -->
                <div class="flex gap-6">
                    <span>Kuala Lumpur, Malaysia</span>
                    <span id="currentDate"></span>
                </div>

                <!-- Right Side: Login Button -->
                <a href="/login.html" class="bg-black hover:bg-gray-800 text-white px-4 py-1 text-xs font-bold uppercase tracking-widest transition">
                    Author Login &rarr;
                </a>

            </div>
        </header>

        <!-- Main Content Grid -->
        <main>
            <div id="articleList" class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <p class="col-span-3 text-center text-gray-500 py-10 italic">Loading the latest news...</p>
            </div>

            <!-- Pagination -->
            <div id="pagination" class="mt-12 pt-6 border-t border-black flex justify-center items-center gap-6"></div>
        </main>

    </div>

    <script>
        // Set today's date in the header
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

        async function loadPublicArticles(page = 1) {
            const list = document.getElementById('articleList');
            list.innerHTML = '<p class="col-span-3 text-center text-gray-500 py-10 italic">Loading the latest news...</p>';
            
            try {
                const res = await api.get(`/api/articles?page=${page}`);
                const responseData = res.data;
                const articles = responseData.data; 

                if (articles.length === 0) {
                    list.innerHTML = '<p class="col-span-3 text-center text-gray-500 py-10 italic">No articles have been published yet.</p>';
                    return;
                }

                // We separate the first article to be the "Main Headline" (like the image)
                const mainArticle = articles[0];
                const otherArticles = articles.slice(1);

                // Render Main Article (Spans 3 columns on desktop)
                                let html = `
                    <div class="col-span-1 md:col-span-3 mb-8 border-b-2 border-black pb-8 flex flex-col md:flex-row gap-8 items-center">
                        <div class="md:w-2/3">
                            <span class="bg-red-700 text-white text-xs font-bold uppercase tracking-wider px-3 py-1 mb-4 inline-block">Top Story</span>
                            <h2 class="font-newspaper text-4xl md:text-5xl font-bold leading-tight mb-4">${mainArticle.title}</h2>
                            <p class="text-gray-600 text-lg leading-relaxed mb-4 font-serif">${mainArticle.content}</p>
                            <span class="text-sm font-bold uppercase tracking-wider">By Admin &bull; ${new Date(mainArticle.created_at).toLocaleDateString()}</span>
                        </div>
                        
                        <!-- UPDATE THIS SECTION -->
                        <div class="md:w-1/3 w-full">
                            ${mainArticle.image 
                                ? `<img src="/storage/${mainArticle.image}" class="w-full h-64 md:h-80 object-cover border border-gray-300" alt="${mainArticle.title}">`
                                : `<div class="w-full h-64 md:h-80 bg-gray-200 border border-gray-300 flex items-center justify-center text-gray-400 uppercase tracking-widest text-sm">Image Placeholder</div>`
                            }
                        </div>
                    </div>
                `;

                // Render Other Articles (Grid)
                html += otherArticles.map(article => `
                    <div class="article-card border-b border-gray-300 pb-6 mb-6">
                        <span class="text-xs font-bold text-red-700 uppercase tracking-wider mb-2 block">Latest News</span>
                        <h3 class="article-title font-newspaper text-2xl font-bold leading-tight mb-2 cursor-pointer transition">${article.title}</h3>
                        <p class="text-gray-600 text-sm leading-relaxed mb-3">${article.content}</p>
                        <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">${new Date(article.created_at).toLocaleDateString()}</span>
                    </div>
                `).join('');

                list.innerHTML = html;
                renderPagination(responseData);

            } catch (error) {
                list.innerHTML = '<p class="col-span-3 text-center text-red-500 py-10">Failed to load articles.</p>';
                console.error(error);
            }
        }

        function renderPagination(data) {
            const paginationDiv = document.getElementById('pagination');
            if (data.last_page === 1) {
                paginationDiv.innerHTML = '';
                return;
            }

            paginationDiv.innerHTML = `
                <button onclick="changePage(${data.current_page - 1})" 
                    class="px-6 py-2 bg-black text-white text-sm font-bold uppercase tracking-widest hover:bg-gray-800 disabled:opacity-30 disabled:cursor-not-allowed transition"
                    ${data.current_page === 1 ? 'disabled' : ''}>
                    &larr; Prev
                </button>
                
                <span class="text-sm font-bold tracking-widest">PAGE ${data.current_page} OF ${data.last_page}</span>
                
                <button onclick="changePage(${data.current_page + 1})" 
                    class="px-6 py-2 bg-black text-white text-sm font-bold uppercase tracking-widest hover:bg-gray-800 disabled:opacity-30 disabled:cursor-not-allowed transition"
                    ${data.current_page === data.last_page ? 'disabled' : ''}>
                    Next &rarr;
                </button>
            `;
        }

        function changePage(page) {
            loadPublicArticles(page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

      

        // Wait for the window to load, then wait 100ms for api.js to initialize
        window.addEventListener('load', () => {
            setTimeout(() => {
                loadPublicArticles(1);
            }, 100);
        });
    </script>
</body>
</html>
